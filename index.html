<script>

/** Résolution URL API — jamais de fallback silencieux vers localhost en production */
function resolveApiBase() {
  const host = location.hostname;
  const isLocal = host === 'localhost' || host === '127.0.0.1' || host === '';
  // Même origine (app servie par le backend Node) → chemins relatifs /api/*
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    if (isLocal || location.port === '3001') return { base: '', ok: true };
    // Production: même host que la page (reverse proxy / même serveur)
    // Override optionnel: localStorage hp_api = URL absolue du backend
    const override = localStorage.getItem('hp_api');
    if (override && /^https?:\/\//i.test(override)) return { base: override.replace(/\/$/, ''), ok: true };
    // Même origine par défaut (recommandé: servir index.html depuis le backend ou un proxy)
    return { base: '', ok: true };
  }
  // file:// ou contexte hors web
  const override = localStorage.getItem('hp_api');
  if (override && /^https?:\/\//i.test(override)) return { base: override.replace(/\/$/, ''), ok: true };
  return { base: null, ok: false, error: 'Configuration requise : définissez localStorage.hp_api avec l\'URL HTTPS du backend (ex. https://api.votredomaine.com). Connexion silencieuse à localhost interdite hors environnement local.' };
}
const _apiResolved = resolveApiBase();
const API = _apiResolved.base === null ? '' : _apiResolved.base;
const API_CONFIG_ERROR = _apiResolved.ok ? null : (_apiResolved.error || 'Configuration API requise');
const S = {
  page: 'boot', dark: localStorage.getItem('hp-dark')==='1',
  token: localStorage.getItem('hp_token')||null,
  user:null, org:null, loading:false, error:null,
  properties:[], reservations:[], cleaning:[], incidents:[], automations:[], automationRuns:[], jobs:[], conversations:[], messages:[], activeConv:null, notifications:[], unreadCount:0, showNotifs:false, notifPrefs:null, billing:null, plans:null, stats:null, calendar:null, systemStatus:null, dashPeriod:'month', pricing:null, reviews:null, reviewStats:null, onboarding:null, showOnboarding:false, onbStep:1, integrations:[],
  showAddProp:false, showAddRes:false, showAddInc:false,
  authMode:'login',
  authForm:{email:'',password:'',first_name:'',organization_name:''}
};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(msg,type='info'){
  const el=document.createElement('div');
  const c={info:'bg-slate-800',success:'bg-green-600',error:'bg-red-600',warn:'bg-amber-500'};
  el.className=`toast ${c[type]||c.info} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium`;
  el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},3200);
}

async function api(path,opts={}){
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  if(S.token) headers.Authorization='Bearer '+S.token;
  const res=await fetch(API+path,{...opts,headers});
  const data=await res.json().catch(()=>({}));
  if(res.status===401 && !path.includes('/auth/login') && !path.includes('/auth/register')){
    S.token=null;S.user=null;localStorage.removeItem('hp_token');S.page='auth';render();
    throw new Error(data.error||'Session expirée');
  }
  if(!res.ok) throw new Error(data.error||data.message||('Erreur '+res.status));
  return data;
}

async function loadAll(){
  S.loading=true;S.error=null;render();
  try{
    const me=await api('/api/auth/me');
    S.user=me.user;S.org=me.organization;
    const [props,resas,clean,incs,autos,runs,jobs,convs,notifs,unread,prefs,billing,plans,stats,cal,sys,pricing,revs,revStats,integ]=await Promise.all([
      api('/api/properties'),api('/api/reservations'),api('/api/cleaning'),
      api('/api/incidents'),api('/api/automations'),api('/api/automations/runs'),api('/api/automations/jobs'),api('/api/conversations'),api('/api/notifications'),api('/api/notifications/unread-count'),api('/api/notification-preferences'),api('/api/billing/subscription'),api('/api/billing/plans'),api('/api/dashboard?period='+(S.dashPeriod||'month')),api('/api/calendar'),api('/api/system/status'),api('/api/pricing/overview'),api('/api/reviews'),api('/api/reviews/stats'),api('/api/integrations')
    ]);
    S.properties=props.properties||[];
    S.reservations=resas.reservations||[];
    S.cleaning=clean.tasks||[];
    S.incidents=incs.incidents||[];
    S.automations=autos.automations||[];
    S.automationRuns=runs.runs||[];
    S.jobs=jobs.jobs||[];
    S.conversations=convs.conversations||[];
    S.notifications=notifs.notifications||[];
    S.unreadCount=unread.count||0;
    S.notifPrefs=prefs;
    S.billing=billing;
    S.plans=plans;
    S.stats=stats;
    S.dashPeriod=S.dashPeriod||'month';
    S.calendar=cal;
    S.systemStatus=sys;
    S.pricing=pricing;
    S.reviews=revs;
    S.reviewStats=revStats;
    S.integrations=integ.integrations||[];
    try{
      const onb=await api('/api/onboarding/status');
      S.onboarding=onb;
      if(onb.needs_onboarding && !sessionStorage.getItem('hp_skip_onb')){
        S.showOnboarding=true;
        S.onbStep=onb.step||1;
      }
    }catch(_){}
    S.page='dashboard';
  }catch(e){
    S.error=e.message;
    if(!S.token) S.page='auth';
    toast(e.message,'error');
  }
  S.loading=false;render();
}

async function doRegister(){
  S.loading=true;render();
  try{
    const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify(S.authForm)});
    S.token=d.token;localStorage.setItem('hp_token',d.token);
    S.user=d.user;S.org=d.organization;
    toast('Compte créé','success');
    await loadAll();
  }catch(e){toast(e.message,'error');S.loading=false;render()}
}

async function doLogin(){
  S.loading=true;render();
  try{
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:S.authForm.email,password:S.authForm.password})});
    S.token=d.token;localStorage.setItem('hp_token',d.token);
    S.user=d.user;S.org=d.organization;
    toast('Connecté','success');
    await loadAll();
  }catch(e){toast(e.message,'error');S.loading=false;render()}
}

function logout(){
  S.token=null;S.user=null;S.org=null;localStorage.removeItem('hp_token');
  S.properties=[];S.reservations=[];S.stats=null;S.page='auth';render();
  toast('Déconnecté','info');
}

function nav(p){S.page=p;S.showAddProp=S.showAddRes=S.showAddInc=false;render()}
function toggleDark(){S.dark=!S.dark;document.documentElement.classList.toggle('dark',S.dark);localStorage.setItem('hp-dark',S.dark?'1':'0');render()}

async function addProperty(){
  const name=document.getElementById('p-name')?.value?.trim();
  const address=document.getElementById('p-addr')?.value?.trim();
  if(!name||!address) return toast('Nom et adresse requis','warn');
  try{
    await api('/api/properties',{method:'POST',body:JSON.stringify({
      name,address,
      wifi_name:document.getElementById('p-wifi')?.value||null,
      entry_code:document.getElementById('p-code')?.value||null
    })});
    toast('Logement enregistré sur le serveur','success');
    S.showAddProp=false;await loadAll();
  }catch(e){toast(e.message,'error')}
}

async function deleteProperty(id){
  if(!confirm('Supprimer ce logement ?')) return;
  try{await api('/api/properties/'+id,{method:'DELETE'});toast('Supprimé','success');await loadAll()}
  catch(e){toast(e.message,'error')}
}

async function addReservation(){
  const property_id=document.getElementById('r-prop')?.value;
  const guest_name=document.getElementById('r-guest')?.value?.trim();
  const check_in=document.getElementById('r-in')?.value;
  const check_out=document.getElementById('r-out')?.value;
  const total_amount=parseFloat(document.getElementById('r-amount')?.value)||0;
  if(!property_id||!guest_name||!check_in||!check_out) return toast('Champs requis manquants','warn');
  try{
    await api('/api/reservations',{method:'POST',body:JSON.stringify({property_id,guest_name,check_in,check_out,total_amount,platform:'direct'})});
    toast('Réservation créée','success');S.showAddRes=false;await loadAll();
  }catch(e){toast(e.message,'error')}
}

async function addIncident(){
  const property_id=document.getElementById('i-prop')?.value;
  const title=document.getElementById('i-title')?.value?.trim();
  const severity=document.getElementById('i-sev')?.value||'low';
  if(!property_id||!title) return toast('Champs requis','warn');
  try{
    await api('/api/incidents',{method:'POST',body:JSON.stringify({property_id,title,description:document.getElementById('i-desc')?.value,severity})});
    toast('Incident créé','success');S.showAddInc=false;await loadAll();
  }catch(e){toast(e.message,'error')}
}

async function resolveIncident(id){
  try{await api('/api/incidents/'+id,{method:'PATCH',body:JSON.stringify({status:'resolved'})});toast('Résolu','success');await loadAll()}
  catch(e){toast(e.message,'error')}
}

async function toggleAuto(id,enabled){
  try{await api('/api/automations/'+id,{method:'PATCH',body:JSON.stringify({enabled})});await loadAll()}
  catch(e){toast(e.message,'error')}
}

async function completeCleaning(id){
  try{await api('/api/cleaning/'+id,{method:'PATCH',body:JSON.stringify({status:'completed'})});toast('Ménage terminé','success');await loadAll()}
  catch(e){toast(e.message,'error')}
}

function renderAuth(){
  const f=S.authForm;
  return `<div class="min-h-screen flex items-center justify-center p-4">
    <div class="card p-8 w-full max-w-md space-y-4">
      <div class="text-center">
        <div class="w-12 h-12 rounded-xl bg-brand-600 text-white flex items-center justify-center text-xl font-bold mx-auto mb-3">H</div>
        <h1 class="text-2xl font-bold">HostPilot</h1>
        <p class="text-sm text-slate-500 mt-1">${S.authMode==='login'?'Connexion au serveur':'Créer un compte'}</p>
      </div>
      ${S.authMode==='register'?`<input class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm" placeholder="Prénom" value="${esc(f.first_name||'')}" oninput="S.authForm.first_name=this.value">
      <input class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm" placeholder="Organisation" value="${esc(f.organization_name||'')}" oninput="S.authForm.organization_name=this.value">`:''}
      <input type="email" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm" placeholder="Email" value="${esc(f.email||'')}" oninput="S.authForm.email=this.value">
      <input type="password" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm" placeholder="Mot de passe (min 8)" value="${f.password||''}" oninput="S.authForm.password=this.value" onkeydown="if(event.key==='Enter')${S.authMode==='login'?'doLogin()':'doRegister()'}">
      <button class="btn-p w-full" ${S.loading?'disabled':''} onclick="${S.authMode==='login'?'doLogin()':'doRegister()'}">${S.loading?'…':(S.authMode==='login'?'Se connecter':'Créer mon compte')}</button>
      <p class="text-center text-sm text-slate-500">${S.authMode==='login'?`Pas de compte ? <button class="text-brand-600 font-medium" onclick="S.authMode='register';render()">S'inscrire</button>`:`Déjà inscrit ? <button class="text-brand-600 font-medium" onclick="S.authMode='login';render()">Connexion</button>`}</p>
      <p class="text-xs text-center text-slate-400">Données sur le serveur · Multi-tenant · Pas de localStorage métier</p>
    </div></div>`;
}

function shell(content){
  const pages=[['dashboard','📊','Dashboard'],['pricing','💶','Tarification'],['reviews','⭐','Avis'],['calendar','📆','Calendrier'],['messages','💬','Messages'],['reservations','📅','Réservations'],['cleaning','🧹','Ménage'],['incidents','⚠️','Incidents'],['properties','🏠','Logements'],['automations','⚡','Automations'],['settings','⚙️','Paramètres']];
  return `<div class="flex h-screen overflow-hidden">
    <aside class="hidden lg:flex flex-col w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
      <div class="p-5 flex items-center gap-2 border-b border-slate-200 dark:border-slate-800"><div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold">H</div><span class="font-bold text-lg">HostPilot</span></div>
      <nav class="flex-1 p-3 space-y-0.5">${pages.map(([id,icon,label])=>`<a href="#" onclick="nav('${id}');return false" class="side flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium ${S.page===id?'active':'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}"><span>${icon}</span>${label}</a>`).join('')}</nav>
      <div class="p-4 border-t border-slate-200 dark:border-slate-800"><p class="text-sm font-medium truncate">${esc(S.user?.first_name||'')}</p><p class="text-xs text-slate-500 truncate">${esc(S.org?.name||'')}</p><button onclick="logout()" class="text-xs text-red-500 mt-2">Déconnexion</button></div>
    </aside>
    <div class="flex-1 flex flex-col overflow-hidden min-w-0">
      <header class="flex items-center justify-between px-4 h-14 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0">
        <div class="flex items-center gap-2 lg:hidden"><div class="w-7 h-7 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-sm">H</div><span class="font-bold">HostPilot</span></div>
        <div class="hidden lg:block text-sm text-slate-500">HostPilot</div>
        <div class="flex items-center gap-2 relative">
          <button onclick="S.showNotifs=!S.showNotifs;render()" class="relative p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800" title="Notifications">
            🔔${S.unreadCount?`<span class="absolute top-1 right-1 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center">${S.unreadCount}</span>`:''}
          </button>
          <button onclick="toggleDark()" class="p-2">🌓</button>
          ${S.showNotifs?`<div class="absolute right-0 top-12 w-80 max-h-96 overflow-y-auto card shadow-xl z-50 p-0">
            <div class="flex justify-between items-center p-3 border-b border-slate-200 dark:border-slate-700">
              <span class="font-semibold text-sm">Notifications</span>
              <button class="text-xs text-brand-600" onclick="markAllRead()">Tout lu</button>
            </div>
            ${(S.notifications||[]).length===0?'<p class="p-4 text-sm text-slate-500">Aucune notification</p>':''}
            ${(S.notifications||[]).slice(0,30).map(n=>`<button onclick='openFromNotif(${JSON.stringify(n).replace(/'/g,"&#39;")})' class="w-full text-left p-3 border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 ${n.read?'opacity-60':''}">
              <div class="flex justify-between gap-2"><span class="text-sm font-medium">${esc(n.title)}</span>
              <span class="text-[10px] ${n.priority==='urgent'||n.priority==='high'?'text-red-600':'text-slate-400'}">${n.priority||''}</span></div>
              <p class="text-xs text-slate-500 mt-0.5 line-clamp-2">${esc(n.message||'')}</p>
              <p class="text-[10px] text-slate-400 mt-1">${n.created_at?new Date(n.created_at).toLocaleString('fr-FR'):''} · ${n.type||''}</p>
            </button>`).join('')}
          </div>`:''}
        </div>
      </header>
      <main class="flex-1 overflow-y-auto p-4 lg:p-6">${S.loading?'<p class="text-slate-500 text-sm">Chargement depuis le serveur…</p>':content}</main>
    </div></div>
  <nav class="lg:hidden fixed bottom-0 inset-x-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex justify-around py-1.5 z-40">
    ${[['dashboard','📊'],['reservations','📅'],['cleaning','🧹'],['properties','🏠'],['settings','⚙️']].map(([id,icon])=>`<button onclick="nav('${id}')" class="p-2 text-xl ${S.page===id?'text-brand-600':'text-slate-500'}">${icon}</button>`).join('')}
  </nav>`;
}


async function genPricingRec(propertyId){
  try{
    await api('/api/properties/'+propertyId+'/pricing/recommendations',{method:'POST',body:'{}'});
    toast('Recommandation créée','success');
    await loadAll();
  }catch(e){toast(e.message,'error')}
}
async function applyPricingRec(propertyId, recId){
  try{
    const d=await api('/api/properties/'+propertyId+'/pricing/recommendations/'+recId+'/apply',{method:'POST',body:'{}'});
    toast(d.message||'Prix appliqué dans HostPilot','success');
    await loadAll();
  }catch(e){toast(e.message,'error')}
}
async function rejectPricingRec(propertyId, recId){
  try{
    await api('/api/properties/'+propertyId+'/pricing/recommendations/'+recId+'/reject',{method:'POST',body:'{}'});
    toast('Recommandation ignorée','info');
    await loadAll();
  }catch(e){toast(e.message,'error')}
}
async function savePricingRules(propertyId){
  const body={
    base_price:Number(document.getElementById('pr-base')?.value),
    min_price:Number(document.getElementById('pr-min')?.value),
    max_price:Number(document.getElementById('pr-max')?.value),
    weekend_pct:Number(document.getElementById('pr-weekend')?.value),
    auto_apply:document.getElementById('pr-auto')?.checked||false,
  };
  try{
    await api('/api/properties/'+propertyId+'/pricing/rules',{method:'PUT',body:JSON.stringify(body)});
    toast('Règles enregistrées','success');
    S.pricingFocus=null;
    await loadAll();
  }catch(e){toast(e.message,'error')}
}
async function openPricing(propertyId){
  try{
    const d=await api('/api/properties/'+propertyId+'/pricing');
    const recs=await api('/api/properties/'+propertyId+'/pricing/recommendations');
    const hist=await api('/api/properties/'+propertyId+'/pricing/history');
    S.pricingFocus={...d, recommendations:recs.recommendations||[], history:hist.history||[]};
    render();
  }catch(e){toast(e.message,'error')}
}

async function addManualReview(){
  if(!S.properties.length) return toast('Créez un logement d\'abord','warn');
  const property_id=S.properties[0].id;
  const rating=Number(prompt('Note 1-5')||'');
  if(!rating||rating<1||rating>5) return toast('Note invalide','warn');
  const comment=prompt('Commentaire (optionnel)')||'';
  try{
    await api('/api/reviews',{method:'POST',body:JSON.stringify({property_id,rating,comment,platform:'direct',guest_name:'Voyageur'})});
    toast('Avis enregistré','success');await loadAll();
  }catch(e){toast(e.message,'error')}
}
async function genReviewReply(id){
  try{
    const d=await api('/api/reviews/'+id+'/generate-response',{method:'POST',body:'{}'});
    if(d.blocked) toast(d.reason||'Intervention humaine','warn');
    else toast('Réponse proposée','success');
    await loadAll();
  }catch(e){toast(e.message,'error')}
}
async function approveReviewReply(id){
  try{
    const d=await api('/api/reviews/'+id+'/approve-response',{method:'POST',body:'{}'});
    toast(d.message||'Approuvé','success');await loadAll();
  }catch(e){toast(e.message,'error')}
}
async function rejectReviewReply(id){
  try{await api('/api/reviews/'+id+'/reject-response',{method:'POST',body:'{}'});await loadAll()}
  catch(e){toast(e.message,'error')}
}
async function reviewToIncident(id){
  try{await api('/api/reviews/'+id+'/create-incident',{method:'POST',body:'{}'});toast('Incident créé','success');await loadAll()}
  catch(e){toast(e.message,'error')}
}
async function syncReviews(){
  try{await api('/api/reviews/sync',{method:'POST',body:'{}'})}
  catch(e){toast(e.message,'warn')}
}
function renderReviews(){
  const st=S.reviewStats||{};
  const list=(S.reviews&&S.reviews.reviews)||[];
  return `<div class="max-w-5xl mx-auto space-y-5 pb-24">
    <div class="flex flex-wrap justify-between gap-2 items-center">
      <div><h1 class="text-2xl font-bold">Avis & Réputation</h1>
      <p class="text-sm text-slate-500">Analyse · réponses proposées · validation humaine</p></div>
      <div class="flex gap-2">
        <button class="btn-s text-sm" onclick="syncReviews()">Synchroniser</button>
        <button class="btn-p text-sm" onclick="addManualReview()">+ Avis (saisie)</button>
      </div>

async function exportResas(){
  try{
    const res=await fetch(API+'/api/export/reservations',{headers:{Authorization:'Bearer '+S.token}});
    if(!res.ok) throw new Error('Export impossible');
    const blob=await res.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='reservations.csv';a.click();
  }catch(e){toast(e.message,'error')}
}

async function patchCleaning(id,status){
  try{await api('/api/cleaning/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('Mis à jour','success');await loadAll()}
  catch(e){toast(e.message,'error')}
}
async function toggleCheck(taskId,itemId,completed){
  try{await api('/api/cleaning/'+taskId+'/checklist/'+itemId,{method:'PATCH',body:JSON.stringify({completed})})}
  catch(e){toast(e.message,'error');await loadAll()}
}
async function reportCleaningProblem(id){
  const description=prompt('Décrire le problème :');
  if(!description) return;
  try{
    await api('/api/cleaning/'+id+'/problem',{method:'POST',body:JSON.stringify({description,title:'Problème ménage',severity:'medium'})});
    toast('Incident créé + notification','success');await loadAll();
  }catch(e){toast(e.message,'error')}
}
async function confirmCheckout(rid){
  if(!confirm('Confirmer le check-out et créer la tâche de ménage ?')) return;
  try{
    const co=await api('/api/reservations/'+rid+'/checkout',{method:'POST',body:'{}'});
    if(co&&co.idempotent) toast(co.message||'Checkout déjà effectué','info');
    else toast('Check-out enregistré · ménage créé','success');
    await loadAll();
  }catch(e){toast(e.message,'error')}
}
async function getCheckinLink(rid){
  try{
    const d=await api('/api/reservations/'+rid+'/checkin-link',{method:'POST',body:'{}'});
    prompt('Lien check-in voyageur (copier) :', d.checkin_url);
  }catch(e){toast(e.message,'error')}
}

async function connectIntegration(platform){
  try{
    const d=await api('/api/integrations/'+platform+'/connect',{method:'POST',body:'{}'});
    if(d.authUrl){ toast('Redirection OAuth officielle…','info'); window.location.href=d.authUrl; }
    else toast(d.message||'OK','info');
  }catch(e){ toast(e.message,'warn'); }
}
async function disconnectIntegration(platform){
  if(!confirm('Déconnecter '+platform+' ?')) return;
  try{ await api('/api/integrations/'+platform+'/disconnect',{method:'POST',body:'{}'}); toast('Déconnecté','success'); await loadAll(); }
  catch(e){ toast(e.message,'error'); }
}
async function syncIntegration(platform){
  try{ const d=await api('/api/integrations/'+platform+'/sync',{method:'POST',body:'{}'}); toast(d.message||'Sync terminée', d.synced?'success':'info'); await loadAll(); }
  catch(e){ toast(e.message,'warn'); }
}


async function openConversation(id){
  try{
    const d=await api('/api/conversations/'+id+'/messages');
    S.activeConv=d.conversation;
    S.messages=d.messages||[];
    S.page='messages';
    render();
  }catch(e){toast(e.message,'error')}
}
async function takeControl(id, on){
  try{
    await api('/api/conversations/'+id,{method:'PATCH',body:JSON.stringify({human_controlled:!!on})});
    toast(on?'Contrôle humain actif':'IA réactivée','success');
    await openConversation(id);
    await loadAll();
  }catch(e){toast(e.message,'error')}
}
async function sendHostMessage(){
  const input=document.getElementById('msg-input');
  const content=input?.value?.trim();
  if(!content||!S.activeConv) return;
  try{
    await api('/api/conversations/'+S.activeConv.id+'/messages',{method:'POST',body:JSON.stringify({content,as_host:true,sender_type:'human'})});
    input.value='';
    await openConversation(S.activeConv.id);
  }catch(e){toast(e.message,'error')}
}
async function simulateGuestMessage(){
  const input=document.getElementById('msg-guest');
  const content=input?.value?.trim();
  if(!content||!S.activeConv) return;
  try{
    const d=await api('/api/conversations/'+S.activeConv.id+'/messages',{method:'POST',body:JSON.stringify({content,channel:'internal'})});
    if(d.escalated) toast('Escalade: '+(d.reason||'intervention'),'warn');
    else if(d.reply) toast('Réponse IA générée','success');
    input.value='';
    await openConversation(S.activeConv.id);
    await loadAll();
  }catch(e){toast(e.message,'error')}
}

  try{await api('/api/notifications/'+id+'/read',{method:'PUT',body:'{}'});await refreshNotifs()}catch(e){toast(e.message,'error')}
}
async function markAllRead(){
  try{await api('/api/notifications/read-all',{method:'POST',body:'{}'});toast('Tout lu','success');await refreshNotifs()}catch(e){toast(e.message,'error')}

async function refreshNotifs(){
  try{
    const [n,u]=await Promise.all([api('/api/notifications'),api('/api/notifications/unread-count')]);
    S.notifications=n.notifications||[];S.unreadCount=u.count||0;render();

}
function openFromNotif(n){
  markRead(n.id);
  S.showNotifs=false;
  if(n.related_incident_id){nav('incidents');return}
  if(n.related_cleaning_task_id){nav('cleaning');return}
  if(n.related_conversation_id){nav('messages');return}
  if(n.related_reservation_id){nav('reservations');return}
  if(n.type==='reservation'){nav('reservations');return}
  if(n.type==='cleaning'){nav('cleaning');return}
  if(n.type==='incident'){nav('incidents');return}
  if(n.type==='message'){nav('messages');return}
}
async function saveNotifPrefs(){
  const cats={};
  document.querySelectorAll('[data-pref]').forEach(el=>{cats[el.getAttribute('data-pref')]=el.checked});
  try{
    await api('/api/notification-preferences',{method:'PUT',body:JSON.stringify({categories:cats})});
    toast('Préférences enregistrées','success');await loadAll();
  }catch(e){toast(e.message,'error')}
}


async function startCheckout(plan){
  try{
    const d=await api('/api/billing/create-checkout-session',{method:'POST',body:JSON.stringify({plan})});
    if(d.url){ window.location.href=d.url; }
    else toast(d.message||'OK','info');
  }catch(e){ toast(e.message,'warn'); }
}
async function openPortal(){
  try{
    const d=await api('/api/billing/create-portal-session',{method:'POST',body:'{}'});
    if(d.url) window.location.href=d.url;
    else toast(d.message||'OK','info');
  }catch(e){ toast(e.message,'warn'); }
}


async function saveOnbOrg(){
  const name=document.getElementById('onb-org')?.value?.trim();
  if(!name) return toast('Nom requis','warn');
  try{
    await api('/api/onboarding/organization',{method:'POST',body:JSON.stringify({
      name,
      country:document.getElementById('onb-country')?.value||'FR',
      currency:document.getElementById('onb-currency')?.value||'EUR',
      timezone:document.getElementById('onb-tz')?.value||'Europe/Paris',
    })});
    S.onbStep=3; toast('Organisation enregistrée','success');
    await api('/api/onboarding/step',{method:'POST',body:JSON.stringify({step:3})});
    render();
  }catch(e){toast(e.message,'error')}
}
async function saveOnbProperty(){
  const name=document.getElementById('onb-pname')?.value?.trim();
  const address=document.getElementById('onb-paddr')?.value?.trim();
  if(!name||!address) return toast('Nom et adresse requis','warn');
  try{
    const d=await api('/api/onboarding/property',{method:'POST',body:JSON.stringify({
      name, address,
      city:document.getElementById('onb-pcity')?.value,
      wifi_name:document.getElementById('onb-wifi')?.value,
      wifi_password:document.getElementById('onb-wifip')?.value,
      entry_code:document.getElementById('onb-code')?.value,
      parking_information:document.getElementById('onb-park')?.value,
      house_rules:document.getElementById('onb-rules')?.value,
      checkin_time:document.getElementById('onb-cin')?.value||'15h00',
      checkout_time:document.getElementById('onb-cout')?.value||'11h00',
      base_price:Number(document.getElementById('onb-price')?.value)||100,
    })});
    toast('Logement créé · connaissances '+ (d.knowledge_percent||0)+'%','success');
    S.onbStep=5;
    await api('/api/onboarding/step',{method:'POST',body:JSON.stringify({step:5})});
    render();
  }catch(e){toast(e.message,'error')}
}
async function saveOnbAutos(){
  const keys=[];
  document.querySelectorAll('[data-onb-auto]:checked').forEach(el=>keys.push(el.getAttribute('data-onb-auto')));
  try{
    await api('/api/onboarding/automations',{method:'POST',body:JSON.stringify({automations:keys})});
    S.onbStep=8; toast('Automatisations configurées','success');
    render();
  }catch(e){toast(e.message,'error')}
}
async function saveOnbNotifs(){
  const categories={};
  document.querySelectorAll('[data-onb-notif]').forEach(el=>{categories[el.getAttribute('data-onb-notif')]=el.checked});
  try{
    await api('/api/onboarding/notifications',{method:'POST',body:JSON.stringify({categories})});
    S.onbStep=10; toast('Notifications enregistrées','success');
    const st=await api('/api/onboarding/status'); S.onboarding=st; render();
  }catch(e){toast(e.message,'error')}
}
async function completeOnboarding(){
  try{
    await api('/api/onboarding/complete',{method:'POST',body:'{}'});
    S.showOnboarding=false; sessionStorage.setItem('hp_skip_onb','1');
    toast('Configuration terminée','success'); await loadAll();
  }catch(e){toast(e.message,'error')}
}
function skipOnboarding(){
  S.showOnboarding=false;
  sessionStorage.setItem('hp_skip_onb','1');
  render();
}
function renderOnboarding(){
  const step=S.onbStep||1;
  const st=S.onboarding||{};
  const pct=st.percent||0;
  return `<div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-900">
    <div class="card p-6 w-full max-w-lg space-y-4">
      <div class="flex justify-between items-center">
        <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold">H</div>
        <button class="text-xs text-slate-500" onclick="skipOnboarding()">Passer</button>
      </div>
      <div class="h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
        <div class="h-full bg-brand-600 transition-all" style="width:${Math.min(100, step*10)}%"></div>
      </div>
      ${step===1?`<div class="space-y-3 text-center py-4">
        <h1 class="text-2xl font-bold">Bienvenue sur HostPilot 👋</h1>
        <p class="text-sm text-slate-500">Automatisez la gestion de vos locations courte durée depuis un seul endroit.</p>
        <button class="btn-p w-full" onclick="S.onbStep=2;render()">Commencer</button>
      </div>`:''}
      ${step===2?`<div class="space-y-3">
        <h2 class="text-xl font-bold">Votre organisation</h2>
        <input id="onb-org" placeholder="Nom de l'activité *" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm" value="${(st.organization&&st.organization.name)||''}">
        <input id="onb-country" placeholder="Pays" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm" value="FR">
        <input id="onb-currency" placeholder="Devise" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm" value="EUR">
        <input id="onb-tz" placeholder="Fuseau" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm" value="Europe/Paris">
        <button class="btn-p w-full" onclick="saveOnbOrg()">Continuer</button>
      </div>`:''}
      ${step===3||step===4?`<div class="space-y-3">
        <h2 class="text-xl font-bold">Premier logement</h2>
        <input id="onb-pname" placeholder="Nom *" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm">
        <input id="onb-paddr" placeholder="Adresse *" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm">
        <input id="onb-pcity" placeholder="Ville" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2.5 text-sm">
        <div class="grid grid-cols-2 gap-2">
          <input id="onb-wifi" placeholder="Wi-Fi" class="rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2 text-sm">
          <input id="onb-wifip" placeholder="Mot de passe Wi-Fi" class="rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2 text-sm">
          <input id="onb-code" placeholder="Code d'accès" class="rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2 text-sm">
          <input id="onb-price" type="number" placeholder="Prix de base €" class="rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2 text-sm">
          <input id="onb-cin" placeholder="Check-in" value="15h00" class="rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2 text-sm">
          <input id="onb-cout" placeholder="Check-out" value="11h00" class="rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2 text-sm">
        </div>
        <input id="onb-park" placeholder="Parking" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2 text-sm">
        <textarea id="onb-rules" placeholder="Règles du logement" rows="2" class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-transparent px-3 py-2 text-sm"></textarea>
        <button class="btn-p w-full" onclick="saveOnbProperty()">Enregistrer le logement</button>
      </div>`:''}
      ${step===5?`<div class="space-y-3">
        <h2 class="text-xl font-bold">Connectez vos plateformes</h2>
        <p class="text-xs text-slate-500">OAuth officiel uniquement · jamais de mot de passe plateforme</p>
        ${['Airbnb','Booking.com','Vrbo'].map(n=>`<div class="border border-slate-200 dark:border-slate-600 rounded-xl p-3 flex justify-between items-center">
          <div><p class="font-medium text-sm">${n}</p><p class="text-xs text-amber-600">Configuration requise</p></div>
          <button class="btn-s text-xs" onclick="toast('Configuration requise — credentials OAuth serveur','warn')">Connecter</button>
        </div>`).join('')}
        <button class="btn-p w-full" onclick="S.onbStep=7;api('/api/onboarding/step',{method:'POST',body:JSON.stringify({step:7})});render()">Continuer</button>
      </div>`:''}
      ${step===7?`<div class="space-y-3">
        <h2 class="text-xl font-bold">Automatisez</h2>
        ${[['reservation_confirm','Message nouvelle réservation'],['checkin_link','Générer lien check-in'],['cleaning_on_checkout','Tâche ménage au départ'],['incident_notify','Notification incident']].map(([k,l])=>
          `<label class="flex items-center gap-2 text-sm"><input type="checkbox" data-onb-auto="${k}" checked> ${l}</label>`).join('')}
        <button class="btn-p w-full" onclick="saveOnbAutos()">Enregistrer</button>
      </div>`:''}
      ${step===8?`<div class="space-y-3">
        <h2 class="text-xl font-bold">Notifications</h2>
        ${['reservation','message','incident','cleaning','automation','integration'].map(c=>
          `<label class="flex items-center gap-2 text-sm"><input type="checkbox" data-onb-notif="${c}" checked> ${c}</label>`).join('')}
        <p class="text-xs text-slate-500">Email / push : Configuration requise si non branchés</p>
        <button class="btn-p w-full" onclick="saveOnbNotifs()">Continuer</button>
      </div>`:''}
      ${step>=10?`<div class="space-y-3">
        <h2 class="text-xl font-bold">Votre HostPilot est presque prêt 🚀</h2>
        <p class="text-sm">Configuration : <strong>${pct}%</strong></p>
        <div class="space-y-1">${(st.checklist||[]).map(i=>`<p class="text-sm ${i.done?'text-green-600':'text-slate-500'}">${i.done?'✓':'○'} ${i.label}${i.detail?(' ('+esc(i.detail)+')'):''}</p>`).join('')}</div>
        <button class="btn-p w-full" onclick="completeOnboarding()">Accéder au Dashboard</button>
        <button class="btn-s w-full text-sm" onclick="skipOnboarding()">Continuer plus tard</button>
      </div>`:''}
    </div>
  </div>`;
}

function render(){
  document.documentElement.classList.toggle('dark',S.dark);
  const root=document.getElementById('root');
  if(S.page==='boot'){root.innerHTML='<div class="min-h-screen flex items-center justify-center text-slate-500">Connexion au serveur…</div>';return}
  if(S.page==='auth'||!S.token){root.innerHTML=renderAuth();return}
  if(S.showOnboarding){root.innerHTML=renderOnboarding();return}
  let content='';
  switch(S.page){
    case'dashboard':content=renderDashboard();break;
    case'reviews':content=renderReviews();break;
    case'pricing':content=renderPricing();break;
    case'calendar':content=renderCalendar();break;
    case'messages':content=renderMessages();break;
    case'properties':content=renderProperties();break;
    case'reservations':content=renderReservations();break;
    case'cleaning':content=renderCleaning();break;
    case'incidents':content=renderIncidents();break;
    case'automations':content=renderAutomations();break;
    case'settings':content=renderSettings();break;
    default:content=renderDashboard();
  }
  root.innerHTML=shell(content);
}

(async function boot(){
  if(API_CONFIG_ERROR){
    S.page='auth'; S.error=API_CONFIG_ERROR; render(); return;
  }

  if(S.dark) document.documentElement.classList.add('dark');
  if(S.token){try{await loadAll()}catch{S.page='auth';render()}}
  else{S.page='auth';render()}
})();

</script>
</body>
</html>
